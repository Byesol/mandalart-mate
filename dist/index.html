<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f4">
  <meta name="description" content="9×9 만다라트로 목표를 나누고, 완료를 기록하고, 고른 목표를 친구에게 공유하세요.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <script src="./model.js" defer></script>
  <script src="./app.js" defer></script>
  <title>만다라트 메이트</title>
</head>
<body>
  <a class="skip" href="#main">목표판으로 이동</a>
  <div id="app" class="shell">
    <aside class="sidebar" aria-label="메인 메뉴">
      <a class="brand" href="#board" data-view="board"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>만다라트 메이트<small>MANDALART MATE</small></span></a>
      <nav id="side-nav" class="side-nav" aria-label="목표 관리"></nav>
      <div id="sections" class="sections"></div>
      <div class="sidebar-foot"><span id="device-icon"></span><span>이 기기에 저장돼요</span></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <a class="brand mini" href="#board" data-view="board"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>만다라트 메이트</span></a>
        <div class="breadcrumb">나의 목표 <span aria-hidden="true">/</span> <strong id="breadcrumb-label">만다라트</strong></div>
        <div class="top-actions">
          <button type="button" class="button secondary top-export" data-action="export"></button>
          <button type="button" class="button primary" data-action="new"></button>
        </div>
      </header>
      <main id="main" class="content" tabindex="-1">
        <div id="main-view" class="main-view"></div>
        <aside id="insights" class="insights" aria-label="목표 현황"></aside>
      </main>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="목표 관리"></nav>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
